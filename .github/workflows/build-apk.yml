name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Ensure Gradle Wrapper JAR
      run: |
        mkdir -p gradle/wrapper
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease -x lintVitalRelease --no-daemon

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: MyReminder-Signed-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
